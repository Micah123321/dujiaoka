[program:dujiaoka-queue]
command=php /app/artisan queue:work --sleep=3 --tries=2 --timeout=60
directory=/app
user=application
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
